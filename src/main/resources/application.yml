server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DATABASE_USERNAME:shortener}
    password: ${DATABASE_PASSWORD:shortener}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 200ms
  jpa:
    hibernate:
      ddl-auto: validate

app:
  base-url: ${BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
